name: Validate CWL
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: coc_cwl
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: coc_cwl_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U coc_cwl -d coc_cwl_test" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://coc_cwl:ci-disposable-only@127.0.0.1:5432/coc_cwl_test
      CWL_TEST_DATABASE_URL: postgres://coc_cwl:ci-disposable-only@127.0.0.1:5432/coc_cwl_test
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm run test:cwl
      - run: npm run check:scores
      - run: npm run check
      - run: npm run build:supabase
      - run: npx --yes deno@2.9.6 check --config supabase/functions/cwl/deno.json supabase/functions/cwl/index.ts
      - run: npx playwright install --with-deps chromium
      - name: Start local preview
        run: |
          npm run dev -- --port 8791 --ip 127.0.0.1 > /tmp/cwl-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8791/ > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cwl-ui-review
          path: .wrangler/cwl-ui-review/
