<head>
<meta charset="utf-8">

<title>CoC Clan Manager</title>
<style>
  html, body { margin:0; padding:0; background:#0b1018; color:#e7ebf3; font:14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .offline-bar {
    position: fixed; top:0; left:0; right:0; z-index:2147483645;
    display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;
    padding:8px 14px; background:linear-gradient(90deg,#1b2230,#2a2110);
    border-bottom:1px solid #6b5a2b; color:#f5d76e; font-size:12.5px;
  }
  .offline-bar b { color:#ffe08a; }
  .offline-bar .offline-actions { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .offline-bar button, .offline-bar .file-label {
    background:#27324a; color:#e7ebf3; border:1px solid #3b4965;
    padding:5px 10px; border-radius:7px; cursor:pointer; font:inherit;
  }
  .offline-bar button:hover, .offline-bar .file-label:hover { background:#303d59; }
  .offline-bar .file-label.primary { background-color:#f5c542; background-image:linear-gradient(135deg,#f5c542,#e0a91c); color:#171717; border-color:#ffe08a; font-weight:700; }
  .offline-bar .file-label.primary:hover { background-color:#f5c542; background-image:linear-gradient(135deg,#f5c542,#e0a91c); }
  .offline-bar input[type=file] { display:none; }
  .offline-bar details { max-width:720px; }
  .offline-bar summary { cursor:pointer; color:#8ab8f5; }
  .offline-bar .offline-note { color:#93a0b8; font-size:12px; }
  .offline-bar { position:relative; justify-content:space-between; background:#151e2d; border-color:#35415a; }
  .offline-bar b { color:#e7ebf3; }
  .offline-bar a { color:#9bc6ff; }
  .offline-bar button, .offline-bar .file-label { min-height:44px; }
  .offline-bar input[type=file] { display:block; max-width:200px; font:inherit; }
  .ws-source { margin:12px 0; padding:12px; background:#151e2d; border:1px solid #35415a; border-radius:8px; overflow-wrap:anywhere; }
  .ws-source p { margin:0 0 8px; }
  .ws-source summary { cursor:pointer; min-height:44px; padding:10px 0; }
  .ws-source a { color:#9bc6ff; }
  .ws-source button, .ws-source select { min-height:44px; font:inherit; }
  .ws-source select { background:#101722; color:#e7ebf3; border:1px solid #63728a; border-radius:6px; padding:6px; max-width:100%; }
  .ws-shield-editor { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr)); gap:8px 16px; margin:12px 0; }
  .ws-shield-editor label { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .ws-shield-editor label span { min-width:0; overflow-wrap:anywhere; }
  button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible, a:focus-visible { outline:2px solid #f5c542; outline-offset:3px; }
  @media (max-width:720px) { .ws-source select { font-size:16px; } }

  @media (max-width:720px) {
    .offline-bar { position:relative; flex-direction:column; align-items:stretch; gap:8px; padding:10px 12px; }
    .offline-bar .offline-actions { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); }
    .offline-bar .offline-actions > * { display:flex; align-items:center; justify-content:center; min-height:44px; text-align:center; }
    .offline-bar details { max-width:none; }
  }
</style>
</head>

  const esc = (value) => String(value == null ? '' : value).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
  const normalizeTag = (tag) => String(tag || '').trim().replace(/^#/, '').toUpperCase();
  const fmtPct = (value) => value == null ? '—' : `${Number(value).toFixed(2).replace(/\.?0+$/, '')}%`;
  const brDate = (value) => {
    const m = String(value || '').match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4}),?\s*(\d{1,2}:\d{2})/);
    return m ? `${m[2].padStart(2, '0')}/${m[1].padStart(2, '0')}/${m[3]} ${m[4]}` : (value || '—');
  };

  function parsePlayerTitle(title) {
    const s = String(title || '').replace(/\s+/g, ' ').trim();
    let m = s.match(/^(.*) - #([0-9A-Z]+) - TH (\d+)$/i);
    if (m) return { name: m[1].trim(), tag: m[2].toUpperCase(), th: Number(m[3]) };
    m = s.match(/^(.*) - #([0-9A-Z]+)$/i);
    if (m) return { name: m[1].trim(), tag: m[2].toUpperCase(), th: null };
    return { name: s, tag: '', th: null };
  }

  function roleFromRow(row) {
    const values = $$('.value', row).map(text);
    return values.find((v) => ROLES.includes(v)) || '';
  }

  // ---------------------------------------------------------------------------
  // Parsers (DOMParser: muito mais estável que regex no navegador)
  // ---------------------------------------------------------------------------

  function parseMembers(content) {
    const doc = new DOMParser().parseFromString(content || '', 'text/html');
    const rows = $$('#members tbody tr[data-click*="/en/player/"]', doc);
    const members = [];
    const seen = new Set();

    rows.forEach((row) => {
      const click = row.getAttribute('data-click') || '';
      const tagMatch = click.match(/\/player\/([0-9A-Z]+)\//i);
      if (!tagMatch) return;
      const tag = tagMatch[1].toUpperCase();
      if (seen.has(tag)) return;
      seen.add(tag);

      const name = text($('td a[href^="/en/player/"] .value', row)) || tag;
      const position = int(text($('.dot', row))) || members.length + 1;
      const thTitle = $('[title^="TH "]', row)?.getAttribute('title') || '';
      const th = int(thTitle.replace(/\D/g, ''));
      const pref = $('img[src*="war-opt-in"]', row) ? 'in'
        : $('img[src*="war-opt-out"]', row) ? 'out'
        : 'unknown';

      members.push({
        tag,
        name,
        position,
        th,
        pref,
        role: roleFromRow(row),
      });
    });

    return members;
  }

  function parseWarHeader(doc) {
    const block = $('[data-content="header"]', doc);
    const get = (sel) => {
      const p = block ? $(sel, block) : null;
      return {
        label: text(p ? $('.param-label', p) : null),
        value: text(p ? $('.param-value', p) : null),
      };
    };

    const type = get('p.type');
    const size = get('p.size');
    const mode = get('p.mode');
    const match = get('p.date-preparation');
    const start = get('p.date-start');
    const end = get('p.date-end');
    const timer = text(block ? $('p.timer .param-label', block) : null);

    const sizeNums = (size.value.match(/\d+/g) || []).map(Number);
    const apmMatch = mode.value.match(/x\s*(\d+)/i);

    return {
      type: type.value || '',
      sizeHome: sizeNums[0] || null,
      sizeAway: sizeNums[1] || sizeNums[0] || null,
      battleMode: mode.value.replace(/\s*x\s*\d+\s*$/i, '').trim(),
      attacksPerMember: apmMatch ? Number(apmMatch[1]) : 2,
      dates: { match: match.value, start: start.value, end: end.value },
      timer,
    };
  }

  function parseWarResult(doc, clanTag) {
    const block = $('[data-content="result"]', doc);
    const out = {
      clans: {},
      stars: {},
      percents: {},
      ourSide: null,
      opponentSide: null,
      label: '',
      state: null,
      attacksUsed: null,
      attacksMax: null,
      opponentAttacksUsed: null,
      opponentAttacksMax: null,
    };
    if (!block) return out;

    Array.from(block.children)
      .filter((el) => el.classList && el.classList.contains('clan'))
      .forEach((el) => {
        const side = el.classList.contains('clan1') ? 1 : 2;
        const link = $('a[href^="/en/clan/"]', el);
        const tagMatch = (link?.getAttribute('href') || '').match(/\/clan\/([0-9A-Z]+)\//i);
        out.clans[side] = {
          tag: tagMatch ? tagMatch[1].toUpperCase() : '',
          name: text($('.clan-name', el)),
        };
      });

    $$('.result-stars', block).forEach((el) => {
      const side = el.classList.contains('clan1') ? 1 : 2;
      out.stars[side] = int(text(el)) || 0;
    });
    $$('.result-percent', block).forEach((el) => {
      const side = el.classList.contains('clan1') ? 1 : 2;
      out.percents[side] = num(text(el));
    });

    const wanted = normalizeTag(clanTag);
    if (out.clans[1]?.tag === wanted) out.ourSide = 1;
    else if (out.clans[2]?.tag === wanted) out.ourSide = 2;
    else out.ourSide = 1;
    out.opponentSide = out.ourSide === 1 ? 2 : 1;

    const labelEl = $('[data-content="result-label"]', doc);
    if (labelEl) {
      const m = (labelEl.className || '').match(/result-(win|lose|draw)/);
      if (m) {
        out.state = m[1];
        out.label = { win: 'VITÓRIA', lose: 'DERROTA', draw: 'EMPATE' }[m[1]];
      } else {
        const t = text(labelEl);
        if (t) out.label = t;
      }
    }
    if (!out.label && /Preparation Day/i.test(text($('[data-content="header"] p.timer', doc)))) {
      out.state = 'preparation';
      out.label = 'DIA DE PREPARAÇÃO';
    }

    const prog = $('[data-content="attack-progression"]', doc);
    if (prog) {
      const first = $('.clan-attack-progression', prog);
      out.attacksUsed = int(text(first ? $('[data-clan="attacks-count"]', first) : null));
      out.attacksMax = int(text(first ? $('[data-clan="attacks-max"]', first) : null));

      const second = $('.opponent-attack-progression', prog);
      const spans = second ? $$('p span', second) : [];
      out.opponentAttacksUsed = int(text(spans[0]));
      out.opponentAttacksMax = int(text(spans[1]));
    }

    return out;
  }

  function parseWarRoster(doc, side) {
    const section = $('[data-content="members"]', doc);
    if (!section) return [];

    const blocks = $$('.members-position > div', section)
      .filter((el) => el.classList && el.classList.contains(`clan${side}`));

    const out = new Map();
    blocks.forEach((el) => {
      const link = $('.members-position-name a[href^="/en/player/"]', el);
      if (!link) return;
      const player = parsePlayerTitle(link.getAttribute('title'));
      if (!player.tag || out.has(player.tag)) return;
      player.position = int(text($('.dot', el))) || out.size + 1;
      out.set(player.tag, player);
    });
    return Array.from(out.values());
  }

  function parseWarAttacks(doc) {
    const rows = $$('[data-content="attacks"] tbody tr', doc);
    const attacks = [];

    rows.forEach((row) => {
      const side = row.classList.contains('clan1') ? 1 : row.classList.contains('clan2') ? 2 : null;
      if (!side) return;

      const links = $$('a.player-identity', row);
      if (links.length < 2) return;

      const attacker = parsePlayerTitle(links[0].getAttribute('title'));
      const defender = parsePlayerTitle(links[1].getAttribute('title'));
      if (!attacker.tag || !defender.tag) return;

      const order = int(text($('.dot', row))) || attacks.length + 1;
      const starsEl = $('.container-stars', row);
      let stars = 0;
      if (starsEl) {
        const m = (starsEl.className || '').match(/stars-(\d)/);
        stars = m ? Number(m[1]) : $$('.fa-star.stars-win', starsEl).length;
      }

      const tds = $$('td', row);
      const duration = text(tds[3] ? $('.value', tds[3]) : null);
      const destruction = num(text(tds[5] ? $('.value', tds[5]) : null));

      attacks.push({
        order,
        side,
        attacker,
        defender,
        stars,
        destruction,
        duration: duration || null,
      });
    });

    attacks.sort((a, b) => a.order - b.order);
    return attacks;
  }

  function enrichAttacks(attacks) {
    const bestByDefender = new Map();
    attacks.forEach((attack) => {
      const previous = bestByDefender.get(attack.defender.tag) || 0;
      attack.newStars = Math.max(0, attack.stars - previous);
      attack.cleanup = attack.newStars === 0;
      bestByDefender.set(attack.defender.tag, Math.max(previous, attack.stars));
    });
    return bestByDefender;
  }

  function computePlayerStats(roster, attacks, ourSide, attacksPerMember) {
    const byAttacker = new Map();
    attacks
      .filter((attack) => attack.side === ourSide)
      .forEach((attack) => {
        const stats = byAttacker.get(attack.attacker.tag) || {
          attacks: 0, stars: 0, newStars: 0, triples: 0, cleanups: 0,
          destructionSum: 0, destructionCount: 0,
        };
        stats.attacks += 1;
        stats.stars += attack.stars;
        stats.newStars += attack.newStars;
        stats.triples += attack.stars === 3 ? 1 : 0;
        stats.cleanups += attack.cleanup ? 1 : 0;
        if (attack.destruction != null) {
          stats.destructionSum += attack.destruction;
          stats.destructionCount += 1;
        }
        byAttacker.set(attack.attacker.tag, stats);
      });

    return roster.map((player) => {
      const stats = byAttacker.get(player.tag) || {
        attacks: 0, stars: 0, newStars: 0, triples: 0, cleanups: 0,
        destructionSum: 0, destructionCount: 0,
      };
      return {
        ...player,
        ...stats,
        avgDestruction: stats.destructionCount ? stats.destructionSum / stats.destructionCount : null,
        missed: Math.max(0, attacksPerMember - stats.attacks),
        inWar: true,
      };
    });
  }

  function parseWar(content, clanTag, id = '') {
    const doc = new DOMParser().parseFromString(content || '', 'text/html');
    const header = parseWarHeader(doc);
    const result = parseWarResult(doc, clanTag);
    const ourSide = result.ourSide || 1;
    const opponentSide = result.opponentSide || (ourSide === 1 ? 2 : 1);
    return buildWar({
      id, header, result,
      roster: parseWarRoster(doc, ourSide), opponentRoster: parseWarRoster(doc, opponentSide),
      attacks: parseWarAttacks(doc),
    });
  }

  function buildWar(normalized) {
    const { id, header, result, roster, opponentRoster, attacks } = normalized;
    const ourSide = result.ourSide || 1;
    const opponentSide = result.opponentSide || (ourSide === 1 ? 2 : 1);
    const bestByDefender = enrichAttacks(attacks);
    const players = computePlayerStats(roster, attacks, ourSide, header.attacksPerMember);
    const ourAttacks = attacks.filter((attack) => attack.side === ourSide);
    const opponentAttacks = attacks.filter((attack) => attack.side === opponentSide);
    const ourDefenders = new Set(ourAttacks.map((attack) => attack.defender.tag));
    const opponentDefenders = new Set(opponentAttacks.map((attack) => attack.defender.tag));
    return {
      ...normalized, players, ourAttacks, opponentAttacks,
      computedOurStars: [...ourDefenders].reduce((sum, tag) => sum + (bestByDefender.get(tag) || 0), 0),
      computedOpponentStars: [...opponentDefenders].reduce((sum, tag) => sum + (bestByDefender.get(tag) || 0), 0),
      ourBasesTripled: [...ourDefenders].filter((tag) => bestByDefender.get(tag) === 3).length,
      opponentBasesTripled: [...opponentDefenders].filter((tag) => bestByDefender.get(tag) === 3).length,
    };
  }

  function firstWarId(content) {
    const ids = [];
    const re = /\/war\/(\d+)#war-details/g;
    let match;
    while ((match = re.exec(content || ''))) {
      if (!ids.includes(match[1])) ids.push(match[1]);
    }
    return ids[0] || null;
  }

  // ---------------------------------------------------------------------------
  // Fetch same-origin (usa os cookies/Cloudflare da própria aba)
  // ---------------------------------------------------------------------------

  async function loadClanData(clanTag) {
    const data = await window.ClanAPI.loadClan(clanTag, { onStatus: (message) => setStatus(message, 'loading') });
    state.clanTag = normalizeTag(clanTag);
    state.source = 'worker';
    state.clanName = data.clan.name;
    state.members = data.members;
    state.lastWar = data.lastWar ? buildWar(data.lastWar) : null;
    state.currentWar = data.currentWar ? buildWar(data.currentWar) : null;
    state.dataWarnings = data.warnings;
    state.fetchedAt = data.fetchedAt;
    state.profileFetchedAt = data.profileFetchedAt;
    state.memberSource = data.memberSource;
    saveSettings();
    setStatus(`${data.clan.name} · ${data.members.length} membros carregados.`, 'ok');
  }

  // ---------------------------------------------------------------------------
  // Regras de seleção
  // ---------------------------------------------------------------------------

  function makeRankFn(rankBy) {
    switch (rankBy) {
      case 'th':
        return (a, b) => (b.member.th || 0) - (a.member.th || 0) || a.member.position - b.member.position;
      case 'performance':
        return (a, b) =>
          (b.newStars || 0) - (a.newStars || 0) ||
          (b.stars || 0) - (a.stars || 0) ||
          (b.attacks || 0) - (a.attacks || 0) ||
          a.member.position - b.member.position;
      case 'name':
        return (a, b) => a.member.name.localeCompare(b.member.name, 'pt-BR');
      case 'position':
      default:
        return (a, b) => a.member.position - b.member.position;
    }
  }

  function nearestStandard(n) {
    // Empate fica no piso (ex.: 32,5 -> 30), como na regra do clã.
    return STANDARD_SIZES.reduce((best, size) =>
      Math.abs(size - n) < Math.abs(best - n) ? size : best, STANDARD_SIZES[0]);
  }

  function nextStandardAtLeast(n) {
    return STANDARD_SIZES.find((size) => size >= n) || STANDARD_SIZES[STANDARD_SIZES.length - 1];
  }

  function largestStandardAtMost(n) {
    const value = Math.max(0, Number(n) || 0);
    return [...STANDARD_SIZES].reverse().find((size) => size <= value) || STANDARD_SIZES[0];
  }

  function roundToStandard(n) {
    const value = Number(n) || 0;
    if (value <= STANDARD_SIZES[0]) return STANDARD_SIZES[0];
    if (value >= STANDARD_SIZES[STANDARD_SIZES.length - 1]) {
      return STANDARD_SIZES[STANDARD_SIZES.length - 1];
    }
    return nearestStandard(value);
  }

  function chooseTarget(settings, eligibleCount, currentWarSize, totalPool) {
    if (settings.targetMode === 'max') {
      // Maior tamanho padrão que o pool de verdes consegue preencher.
      return largestStandardAtMost(totalPool);
    }
    let raw;
    if (settings.targetMode === 'fixed') raw = Number(settings.fixedSize) || 30;
    else if (settings.targetMode === 'current' && currentWarSize) raw = currentWarSize;
    else raw = eligibleCount;
    // A guerra só existe em múltiplos de 5: 5, 10, ..., 50.
    return roundToStandard(raw);
  }

  function selectTeam(members, lastWar, settings, currentWar) {
    const perfByTag = new Map((lastWar?.players || []).map((player) => [player.tag, player]));
    const rank = makeRankFn(settings.rankBy);
    const forcedIn = new Set(settings.forcedIn || []);
    const forcedOut = new Set(settings.forcedOut || []);
    const whitelist = new Set(settings.whitelist || []);
    const blacklist = new Set(settings.blacklist || []);

    const all = members.map((member) => {
      const perf = perfByTag.get(member.tag) || null;
      const inWar = Boolean(perf);
      const attacks = perf ? perf.attacks : 0;
      const stars = perf ? perf.stars : 0;
      const newStars = perf ? perf.newStars : 0;
      const triples = perf ? perf.triples : 0;
      const hardReasons = [];
      const ruleReasons = [];
      const softReasons = [];

      const isBlacklisted = blacklist.has(member.tag);
      // BL vence WL. O filtro de escudo ativo também bloqueia a WL.
      const isWhitelisted = whitelist.has(member.tag) && !isBlacklisted;

      if (isBlacklisted) hardReasons.push('lista de exclusão (BL)');
      if (settings.excludeRed && member.pref !== 'in') {
        hardReasons.push(member.pref === 'out' ? 'escudo vermelho' : 'escudo desconhecido');
      }

      if (!inWar) {
        if (!settings.allowNoWarData) softReasons.push('sem dados da última guerra');
      } else {
        if (settings.requireTwoAttacks && attacks < 2) {
          softReasons.push(`menos de 2 ataques (${attacks}/2)`);
        }
        if (settings.requireOneStar && stars < 1) {
          softReasons.push('0 estrelas na última guerra');
        }
        if (settings.requireTriple && triples < 1) {
          ruleReasons.push('sem ataque com 3 estrelas');
        }
      }

      const isForcedIn = forcedIn.has(member.tag);
      const isForcedOut = forcedOut.has(member.tag);
      const hardFail = hardReasons.length > 0;
      const strictEligible = !hardFail && ruleReasons.length === 0 && softReasons.length === 0 && !isForcedOut;
      // WL passa por cima dos critérios de desempenho, mas respeita BL e os filtros de escudo ativos.
      const eligible = !hardFail && (isWhitelisted || strictEligible || (isForcedIn && !isForcedOut));

      return {
        member,
        perf,
        inWar,
        attacks,
        stars,
        newStars,
        triples,
        hardReasons,
        ruleReasons,
        softReasons,
        hardFail,
        strictEligible,
        eligible,
        whitelisted: isWhitelisted,
        blacklisted: isBlacklisted,
        whitelistBlocked: isWhitelisted && hardFail,
        forcedIn: isForcedIn,
        forcedOut: isForcedOut,
        exception: false,
        trimmed: false,
      };
    });

    const eligibleList = all
      .filter((row) => row.eligible || (row.forcedIn && !row.hardFail && !row.forcedOut))
      .sort((a, b) => Number(b.whitelisted) - Number(a.whitelisted) || rank(a, b));
    eligibleList.forEach((row) => {
      if (row.forcedIn && !row.eligible) row.exception = true;
    });

    const fallback = all
      .filter((row) =>
        !row.hardFail &&
        row.ruleReasons.length === 0 &&
        !row.whitelisted &&
        !row.eligible &&
        !row.forcedOut &&
        !row.forcedIn
      )
      .sort(rank);

    const strictCount = all.filter((row) => row.strictEligible).length;
    const whitelistCount = eligibleList.filter((row) => row.whitelisted).length;
    const whitelistOnlyCount = eligibleList.filter(
      (row) => row.whitelisted && !row.strictEligible
    ).length;
    const blacklistCount = all.filter((row) => row.blacklisted).length;
    const whitelistBlocked = all.filter((row) => row.whitelistBlocked);

    const currentWarSize = currentWar?.header?.sizeHome || null;
    const greenPoolSize = eligibleList.length + fallback.length;
    let target = chooseTarget(settings, eligibleList.length, currentWarSize, greenPoolSize);
    const whitelistFloor = nextStandardAtLeast(whitelistCount);
    let targetAdjustedForWhitelist = false;
    if (whitelistFloor > target) {
      target = whitelistFloor;
      targetAdjustedForWhitelist = true;
    }
    target = roundToStandard(target);

    let selected = eligibleList.slice();
    let trimmed = [];

    if (selected.length > target) {
      const excess = selected.length - target;
      // No modo "máximo possível", corta o necessário para caber no alvo.
      const allowed = settings.targetMode === 'max'
        ? excess
        : Math.min(excess, Math.max(0, Number(settings.maxTrim) || 0));
      let remaining = allowed;
      for (let i = selected.length - 1; i >= 0 && remaining > 0; i -= 1) {
        if (!selected[i].whitelisted && !selected[i].forcedIn) {
          trimmed.unshift(selected.splice(i, 1)[0]);
          remaining -= 1;
        }
      }
    } else if (selected.length < target) {
      const need = target - selected.length;
      // No modo "máximo possível", preenche todas as vagas disponíveis.
      const allowed = settings.targetMode === 'max'
        ? need
        : Math.min(need, Math.max(0, Number(settings.maxFill) || 0));
      const pool = fallback;
      const picks = allowed <= 0
        ? []
        : settings.fillFrom === 'bottom'
          ? pool.slice(-allowed)
          : pool.slice(0, allowed);
      picks.forEach((row) => {
        row.exception = true;
        selected.push(row);
      });
    }

    trimmed.forEach((row) => { row.trimmed = true; });

    const selectedTags = new Set(selected.map((row) => row.member.tag));
    const bench = all.filter((row) => !selectedTags.has(row.member.tag)).sort(rank);

    const warnings = [];
    if (selected.length < target) {
      if (selected.length >= greenPoolSize) {
        warnings.push(
          `Só há ${greenPoolSize} jogadores disponíveis com os critérios atuais; faltam ${target - selected.length} vagas para chegar a ${target}. ` +
          'Altere os critérios ou o filtro de escudo, ou peça para alguém mudar a preferência de guerra no jogo.'
        );
      } else {
        warnings.push(`Faltam ${target - selected.length} vagas para chegar a ${target}. O limite permite até ${settings.maxFill} exceções; aumente-o se quiser incluir mais jogadores fora dos critérios.`);
      }
    }
    if (selected.length > target) {
      warnings.push(`Há ${selected.length - target} jogadores acima das ${target} vagas. O limite permite deixar ${settings.maxTrim} aptos de fora; aumente-o para completar o corte.`);
    }
    if (whitelistBlocked.length) {
      warnings.push(
        'A lista de inclusão (WL) não supera os filtros de escudo ativos: ' +
        whitelistBlocked.map((row) => `${row.member.name} (#${row.member.tag}: ${row.hardReasons.join(', ')})`).join(', ') +
        '. Ajuste o escudo no jogo ou retire esses jogadores da WL.'
      );
    }
    if (whitelistCount > STANDARD_SIZES[STANDARD_SIZES.length - 1]) {
      warnings.push(
        `Há ${whitelistCount} jogadores na lista de inclusão (WL), mas o tamanho máximo da guerra é 50. ` +
        'Os excedentes não cabem no time.'
      );
    }

    let targetLabel = '';
    if (settings.targetMode === 'fixed') {
      targetLabel = `tamanho definido: ${target}v${target}`;
    } else if (settings.targetMode === 'current' && currentWarSize) {
      targetLabel = currentWarSize === target
        ? `mesmo tamanho da guerra atual (${target}v${target})`
        : `guerra atual: ${currentWarSize} jogadores; usando ${target}v${target}`;
    } else if (settings.targetMode === 'max') {
      targetLabel = `maior tamanho possível entre ${greenPoolSize} jogadores disponíveis: ${target}v${target}`;
    } else {
      targetLabel = `tamanho padrão mais próximo dos ${eligibleList.length} aptos: ${target}v${target}`;
    }
    if (targetAdjustedForWhitelist) {
      targetLabel += ` · ampliado para incluir ${whitelistCount} jogadores da WL`;
    }

    return {
      target,
      targetLabel,
      currentWarSize,
      strictCount,
      whitelistCount,
      whitelistOnlyCount,
      blacklistCount,
      whitelistBlocked,
      targetAdjustedForWhitelist,
      selected,
      bench,
      all,
      trimmed,
      fallback,
      warnings,
      perfByTag,
    };
  }

  // ---------------------------------------------------------------------------
  // Estado e persistência
  // ---------------------------------------------------------------------------

  const state = {
    clanTag: DEFAULT_CLAN,
    members: [],
    lastWar: null,
    currentWar: null,
    settings: { ...DEFAULT_SETTINGS },
    selection: null,
    loading: false,
    error: '',
    status: '',
    statusType: 'muted',
    source: '', dataWarnings: [], fetchedAt: '', clanName: '',
  };

  function loadSettings() {
    try {
      const saved = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
      state.settings = { ...DEFAULT_SETTINGS, ...saved };
      if (saved.clanTag) state.clanTag = saved.clanTag;
    } catch (error) {
      state.settings = { ...DEFAULT_SETTINGS };
    }
    // Normaliza valores antigos/inválidos.
    state.settings.fixedSize = nearestStandard(Number(state.settings.fixedSize) || 30);
    state.settings.whitelist = Array.isArray(state.settings.whitelist) ? state.settings.whitelist : [];
    state.settings.blacklist = Array.isArray(state.settings.blacklist) ? state.settings.blacklist : [];
    state.settings.forcedIn = Array.isArray(state.settings.forcedIn) ? state.settings.forcedIn : [];
    state.settings.forcedOut = Array.isArray(state.settings.forcedOut) ? state.settings.forcedOut : [];
  }

  function saveSettings() {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify({ ...state.settings, clanTag: state.clanTag }));
    } catch (error) {
      // localStorage pode estar bloqueado; ignora.
    }
  }

  function setStatus(message, type = 'muted') {
    state.status = message;
    state.statusType = type;
    renderStatus();
  }

  const HTML = `

    <div id="ws-lists-overlay" class="ws-hidden">

            <div class="ws-title">Listas de inclusão e exclusão</div>

          <input id="ws-lists-search" type="search" aria-label="Filtrar jogadores por nome ou tag" placeholder="Digite um nome ou tag" autocomplete="off">
          <button id="ws-lists-clear-wl" class="ws-btn small" type="button">Limpar lista de inclusão</button>
          <button id="ws-lists-clear-bl" class="ws-btn small" type="button">Limpar lista de exclusão</button>

          <span id="ws-lists-stale"></span>
        </div>
      </div>
    </div>
  `;

  function injectUI() {
    if ($('#ws-fab')) return;

    const style = document.createElement('style');
    style.id = 'ws-style';
    style.textContent = STYLE;
    document.head.appendChild(style);

    const container = document.createElement('div');
    container.id = 'ws-root';
    container.innerHTML = HTML;
    document.body.appendChild(container);

    $('#ws-clan').value = state.clanTag;
    bindEvents();
    render();
  }

  function openModal() {
    $('#ws-overlay').classList.remove('ws-hidden');
    if (!state.members.length && !state.loading) {
      handleLoad();
    }
  }

  function closeModal() {
    $('#ws-overlay').classList.add('ws-hidden');
    closeListsModal();
  }

  function openListsModal() {
    if (!state.members.length) {
      setStatus('Carregue os dados do clã para ver e ajustar quem entra no time.', 'error');
      return;
    }
    renderListsModal();
    $('#ws-lists-overlay').classList.remove('ws-hidden');
    $('#ws-lists-search').value = '';
    filterListsModal();
    $('#ws-lists-search').focus();
  }

  function closeListsModal() {
    $('#ws-lists-overlay').classList.add('ws-hidden');
  }

  function currentTagsSet() {
    return new Set(state.members.map((member) => member.tag));
  }

  function updateListsCounts() {
    const whitelist = (state.settings.whitelist || []).length;
    const blacklist = (state.settings.blacklist || []).length;
    const counts = $('#ws-lists-counts');
    if (counts) counts.textContent = `${whitelist} para incluir · ${blacklist} para excluir`;
    const button = $('#ws-lists-btn');
    if (button) button.textContent = `Incluir/excluir (${whitelist}/${blacklist})`;
  }

  function renderListsModal() {
    const body = $('#ws-lists-body');
    if (!body) return;

    if (!state.members.length) {
      body.innerHTML = '<div class="ws-empty">Carregue os dados do clã para ver quem pode entrar no time.</div>';
      updateListsCounts();
      return;
    }

    const members = state.members.slice().sort((a, b) => a.position - b.position);
    const perfByTag = new Map((state.lastWar?.players || []).map((player) => [player.tag, player]));
    const whitelist = new Set(state.settings.whitelist || []);
    const blacklist = new Set(state.settings.blacklist || []);

    body.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Jogador</th>
            <th class="center">TH</th>
            <th class="center">Pos</th>
            <th class="center">Escudo</th>
            <th>Últ. guerra</th>
            <th class="center" title="Lista de inclusão: tentar incluir mesmo fora dos critérios de desempenho">WL</th>
            <th class="center" title="Lista de exclusão: não incluir na sugestão">BL</th>
          </tr>
        </thead>
        <tbody>
          ${members.map((member) => {
            const perf = perfByTag.get(member.tag);
            const lastWar = perf
              ? `${perf.attacks} atk · ${perf.stars}★ · ${perf.triples}x3★`
              : '<span class="ws-muted">sem registro</span>';
            const search = `${member.name} ${member.tag}`.toLowerCase();
            return `
              <tr data-tag="${esc(member.tag)}" data-search="${esc(search)}">
                <td data-label="Jogador">
                  <div class="ws-name">${esc(member.name)}</div>
                  <div class="ws-tag-small">#${esc(member.tag)}</div>
                  <div class="ws-list-mobile-meta">
                    <span>TH ${member.th ?? '—'}</span>
                    <span>Pos. ${member.position ?? '—'}</span>
                    <span class="ws-pref"><span class="ws-shield ${member.pref}" aria-hidden="true"></span>${member.pref === 'in' ? 'Quer' : member.pref === 'out' ? 'Não quer' : 'Indefinido'}</span>
                    <span>Guerra: ${perf ? `${perf.attacks} atk · ${perf.stars}★ · ${perf.triples}x3★` : 'sem registro'}</span>
                  </div>
                </td>
                <td class="center" data-label="TH">${member.th ?? '—'}</td>
                <td class="center ws-muted" data-label="Posição no clã">${member.position ?? '—'}</td>
                <td class="center" data-label="Escudo"><span class="ws-shield ${member.pref}" role="img" title="${member.pref === 'in' ? 'Escudo verde: quer participar' : member.pref === 'out' ? 'Escudo vermelho: não quer participar' : 'Escudo desconhecido'}" aria-label="${member.pref === 'in' ? 'Escudo verde: quer participar' : member.pref === 'out' ? 'Escudo vermelho: não quer participar' : 'Escudo desconhecido'}"></span></td>
                <td data-label="Última guerra">${lastWar}</td>
                <td class="center" data-label="Incluir na WL">
                  <input type="checkbox" data-list="whitelist" data-tag="${esc(member.tag)}" aria-label="Tentar incluir ${esc(member.name)} (WL)" title="Tentar incluir mesmo fora dos critérios de desempenho; respeita os filtros ativos" ${whitelist.has(member.tag) ? 'checked' : ''}>
                </td>
                <td class="center" data-label="Excluir na BL">
                  <input type="checkbox" data-list="blacklist" data-tag="${esc(member.tag)}" aria-label="Excluir ${esc(member.name)} da sugestão (BL)" title="Não incluir este jogador na sugestão" ${blacklist.has(member.tag) ? 'checked' : ''}>
                </td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
    `;

    const known = currentTagsSet();
    const stale = [...whitelist, ...blacklist].filter((tag) => !known.has(tag));
    const staleEl = $('#ws-lists-stale');
    if (staleEl) {
      staleEl.innerHTML = stale.length
        ? `<button class="ws-danger-link" data-action="prune-stale" title="Remover das listas as tags de jogadores que não estão mais no clã">Limpar ${stale.length} tags de quem não está no clã</button>`
        : '';
    }
    updateListsCounts();
  }

  function filterListsModal() {
    const query = ($('#ws-lists-search')?.value || '').trim().toLowerCase();
    $$('#ws-lists-body tbody tr').forEach((row) => {
      const haystack = row.getAttribute('data-search') || '';
      row.classList.toggle('ws-list-hidden', Boolean(query) && !haystack.includes(query));
    });
  }

  function handleListToggle(event) {
    const checkbox = event.target.closest('input[data-list][data-tag]');
    if (!checkbox) return;

    const tag = normalizeTag(checkbox.getAttribute('data-tag'));
    const list = checkbox.getAttribute('data-list');
    const whitelist = new Set(state.settings.whitelist || []);
    const blacklist = new Set(state.settings.blacklist || []);
    const forcedIn = new Set(state.settings.forcedIn || []);
    const forcedOut = new Set(state.settings.forcedOut || []);

    if (list === 'whitelist') {
      if (checkbox.checked) {
        whitelist.add(tag);
        blacklist.delete(tag);
        forcedOut.delete(tag);
        forcedIn.delete(tag);
      } else {
        whitelist.delete(tag);
      }
    } else if (list === 'blacklist') {
      if (checkbox.checked) {
        blacklist.add(tag);
        whitelist.delete(tag);
        forcedIn.delete(tag);
        forcedOut.delete(tag);
      } else {
        blacklist.delete(tag);
      }
    }

    state.settings.whitelist = [...whitelist];
    state.settings.blacklist = [...blacklist];
    state.settings.forcedIn = [...forcedIn];
    state.settings.forcedOut = [...forcedOut];
    saveSettings();

    if (checkbox.checked) {
      const row = checkbox.closest('tr');
      const otherList = list === 'whitelist' ? 'blacklist' : 'whitelist';
      const other = row?.querySelector(`input[data-list="${otherList}"]`);
      if (other) other.checked = false;
    }

    updateListsCounts();
    render();
  }

  function handleListAction(event) {
    const button = event.target.closest('button[data-action="prune-stale"]');
    if (button) {
      pruneStaleLists();
    }
  }

  function clearList(listName) {
    state.settings[listName] = [];
    saveSettings();
    renderListsModal();
    filterListsModal();
    render();
  }

  function pruneStaleLists() {
    const known = currentTagsSet();
    state.settings.whitelist = (state.settings.whitelist || []).filter((tag) => known.has(tag));
    state.settings.blacklist = (state.settings.blacklist || []).filter((tag) => known.has(tag));
    saveSettings();
    renderListsModal();
    filterListsModal();
    render();
  }

  function bindEvents() {
    $('#ws-fab').addEventListener('click', openModal);
    $('#ws-close').addEventListener('click', closeModal);
    $('#ws-overlay').addEventListener('click', (event) => {
      if (event.target === $('#ws-overlay')) closeModal();
    });

    document.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape') return;
      if (!$('#ws-lists-overlay').classList.contains('ws-hidden')) {
        closeListsModal();
        return;
      }
      if (!$('#ws-overlay').classList.contains('ws-hidden')) closeModal();
    });

    $('#ws-load').addEventListener('click', handleLoad);
    $('#ws-copy').addEventListener('click', copySelected);
    $('#ws-export').addEventListener('click', exportJson);

    $('#ws-lists-btn').addEventListener('click', openListsModal);
    $('#ws-lists-close').addEventListener('click', closeListsModal);
    $('#ws-lists-overlay').addEventListener('click', (event) => {
      if (event.target === $('#ws-lists-overlay')) closeListsModal();
    });
    $('#ws-lists-search').addEventListener('input', filterListsModal);
    $('#ws-lists-body').addEventListener('change', handleListToggle);
    $('#ws-lists-overlay').addEventListener('click', handleListAction);
    $('#ws-lists-clear-wl').addEventListener('click', () => clearList('whitelist'));
    $('#ws-lists-clear-bl').addEventListener('click', () => clearList('blacklist'));

    $('#ws-clan').addEventListener('change', () => {
      $('#ws-clan').value = normalizeTag($('#ws-clan').value);
    });
    $('#ws-clan').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') { event.preventDefault(); handleLoad(); }
    });
    $('#ws-rules').addEventListener('change', handleRuleChange);
    $('#ws-results').addEventListener('click', handleResultClick);
  }

  function handleRuleChange(event) {
    const target = event.target;
    const key = target?.getAttribute?.('data-setting');
    if (!key) return;

    if (target.type === 'checkbox') {
      state.settings[key] = target.checked;
    } else if (target.type === 'number') {
      state.settings[key] = clamp(Number(target.value) || 0, 0, 50);
    } else {
      state.settings[key] = target.value;
    }

    saveSettings();
    render();
  }

  function handleResultClick(event) {
    const button = event.target.closest('button[data-action]');
    if (!button) return;

    const action = button.getAttribute('data-action');
    const tag = normalizeTag(button.getAttribute('data-tag'));
    if (!tag) return;

    const forcedIn = new Set(state.settings.forcedIn || []);
    const forcedOut = new Set(state.settings.forcedOut || []);
    const whitelist = new Set(state.settings.whitelist || []);
    const blacklist = new Set(state.settings.blacklist || []);

    if (action === 'force-in') {
      if (blacklist.has(tag)) return;
      forcedOut.delete(tag);
      forcedIn.add(tag);
    } else if (action === 'force-out') {
      forcedIn.delete(tag);
      whitelist.delete(tag);
      forcedOut.add(tag);
    } else if (action === 'clear-force') {
      forcedIn.delete(tag);
      forcedOut.delete(tag);
    } else if (action === 'remove-whitelist') {
      whitelist.delete(tag);
    } else if (action === 'remove-blacklist') {
      blacklist.delete(tag);
    }

    state.settings.forcedIn = [...forcedIn];
    state.settings.forcedOut = [...forcedOut];
    state.settings.whitelist = [...whitelist];
    state.settings.blacklist = [...blacklist];
    saveSettings();
    render();
  }

  async function handleLoad() {
    if (state.loading) return;

    const requestedTag = normalizeTag($('#ws-clan').value) || DEFAULT_CLAN;
    state.clanTag = requestedTag;
    $('#ws-clan').value = requestedTag;
    state.source = 'clashking';
    state.members = []; state.lastWar = null; state.currentWar = null;
    state.dataWarnings = []; state.fetchedAt = ''; state.clanName = '';
    state.loading = true;
    state.error = '';
    renderLoading();
    render();

    try {
      await loadClanData(requestedTag);
    } catch (error) {
      state.error = error.message || String(error);
      setStatus(state.error, 'error');
      render();
    } finally {
      state.loading = false;
      render();
    }
  }

  function renderLoading() {
    $('#ws-load').disabled = true;
    $('#ws-load').textContent = 'Carregando...';
    setStatus('Carregando dados...', 'loading');
    renderStatus();
  }

  function renderStatus() {
    const el = $('#ws-status');
    if (!el) return;

    const type = state.statusType || 'muted';
    el.className = `ws-status ${type === 'muted' ? '' : type}`.trim();
    el.innerHTML = '';

    if (type === 'loading') {
      const spinner = document.createElement('span');
      spinner.className = 'ws-spinner';
      el.appendChild(spinner);
    }
    const span = document.createElement('span');
    span.textContent = state.error || state.status || 'Pronto.';
    el.appendChild(span);
  }

  function render() {
    if (!$('#ws-root')) return;

    $('#ws-load').disabled = state.loading;
    $('#ws-load').textContent = state.loading ? 'Carregando...' : 'Atualizar dados';
    $('#ws-clan').disabled = state.loading;
    for (const id of ['demo-btn', 'ws-demo', 'har-file']) { const el = document.getElementById(id); if (el) el.disabled = state.loading; }
    $('#ws-clan').value = state.clanTag;

    state.selection = state.members.length
      ? selectTeam(state.members, state.lastWar, state.settings, state.currentWar)
      : null;

    $('#ws-copy').disabled = !state.selection || !state.selection.selected.length;
    $('#ws-export').disabled = !state.selection;
    $('#ws-lists-btn').disabled = !state.members.length;
    updateListsCounts();

    renderStatus();
    renderSource();
    renderSummary();
    renderRules();
    renderResults();
    renderLastWar();
  }

  function renderSource() {
    const el = $('#ws-source');
    el.hidden = !state.source;
    if (!state.source) return;
    const live = state.source === 'worker';
    const mode = $('#data-mode');
    if (mode) mode.textContent = live ? 'CoC Clan Manager · consulta pelo Worker' : state.source === 'demo' ? 'DEMO · captura de 20/10/2026' : 'HAR · dados da captura importada';
    if (!live) {
      el.innerHTML = '<p><strong>' + (state.source === 'demo' ? 'Demonstração de 20/10/2026' : 'Arquivo HAR importado') + '</strong> · Dados de uma captura; não representam uma consulta atual.</p>';
      return;
    }
    const unknown = state.members.filter((member) => member.pref === 'unknown').length;
    el.innerHTML = '<p><strong>' + esc(state.clanName || 'Consultando o clã') + '</strong>'
      + (state.fetchedAt ? ' · Consulta em ' + esc(new Date(state.fetchedAt).toLocaleString('pt-BR')) : '') + '</p>'
      + '<p>Escudos, cargos e posições consultados pela API de perfis. Histórico de guerras: <a href="https://api.clashk.ing/swagger/index.html" target="_blank" rel="noopener">ClashKing</a>. As fontes podem ter atraso; cache de até 1 minuto.</p>'
      + (unknown ? '<p><strong>' + unknown + ' escudos indisponíveis.</strong> Com o filtro de escudo ligado, esses jogadores ficam fora da seleção.</p>' : '')
      + state.dataWarnings.map((warning) => '<p class="ws-warning">' + esc(warning) + '</p>').join('');
  }

  function renderSummary() {
    const el = $('#ws-summary');
    if (!state.members.length) {
      el.innerHTML = '';
      return;
    }

    const green = state.members.filter((m) => m.pref === 'in').length;
    const red = state.members.filter((m) => m.pref === 'out').length;
    const unknown = state.members.length - green - red;
    const selection = state.selection;
    const currentWar = state.currentWar;
    const lastWar = state.lastWar;

    const aptosValue = selection
      ? `${selection.strictCount}${selection.whitelistOnlyCount ? ` +${selection.whitelistOnlyCount} pela WL` : ''}`
      : '—';
    const cards = [
      ['Membros', state.members.length, ''],
      ['Verdes', green, 'green'],
      ['Vermelhos', red, 'red'],
      ['Aptos pelas regras', aptosValue, ''],
      ['Selecionados', selection ? selection.selected.length : '—', 'gold'],
      ['Vagas no time', selection ? selection.target : '—', 'gold'],
    ];

    const warInfo = lastWar
      ? `Última guerra concluída: #${lastWar.id} · ${lastWar.result.clans[lastWar.result.ourSide]?.name || '—'} vs ${lastWar.result.clans[lastWar.result.opponentSide]?.name || '—'} · ${lastWar.result.stars[lastWar.result.ourSide] ?? '—'} x ${lastWar.result.stars[lastWar.result.opponentSide] ?? '—'} estrelas`
      : 'Última guerra: —';
    const currentInfo = currentWar
      ? `Guerra atual: ${currentWar.header.sizeHome}v${currentWar.header.sizeAway} · ${currentWar.result.label || 'em andamento'}`
      : 'Tamanho da guerra atual: indisponível';

    const perfByTag = new Map((lastWar?.players || []).map((player) => [player.tag, player]));
    const greenNoData = state.members.filter((m) => m.pref === 'in' && !perfByTag.has(m.tag)).length;
    const greenOneAttack = state.members.filter((m) => {
      if (m.pref !== 'in') return false;
      const p = perfByTag.get(m.tag);
      return p && p.attacks < 2;
    }).length;
    const greenZeroStars = state.members.filter((m) => {
      if (m.pref !== 'in') return false;
      const p = perfByTag.get(m.tag);
      return p && p.stars < 1;
    }).length;
    const greenZeroTriples = state.members.filter((m) => {
      if (m.pref !== 'in') return false;
      const p = perfByTag.get(m.tag);
      return p && p.triples < 1;
    }).length;
    const selectedWhitelistCount = selection
      ? selection.selected.filter((row) => row.whitelisted).length
      : 0;
    const selectedExceptionCount = selection
      ? selection.selected.filter((row) => !row.whitelisted && row.exception).length
      : 0;
    const selectedStrictCount = selection
      ? selection.selected.length - selectedWhitelistCount - selectedExceptionCount
      : 0;

    el.innerHTML = `
      <div class="ws-cards">

            <div class="ws-k">${esc(label)}</div>
            <div class="ws-v">${esc(value)}</div>
          </div>

      </div>
      <div class="ws-flex ws-small ws-muted" style="margin-top:-6px;">
        <span>${esc(warInfo)}</span>
        <span>·</span>
        <span>${esc(currentInfo)}</span>
        ${unknown ? `<span>·</span><span>${unknown} escudo(s) desconhecido(s)</span>` : ''}
      </div>
      <div class="ws-flex ws-small ws-muted" style="margin-top:4px;">
        <span>Resumo dos jogadores com escudo verde:</span>
        <span>${greenNoData} sem registro na última guerra</span>
        <span>·</span>
        <span>${greenOneAttack} com menos de 2 ataques</span>
        <span>·</span>
        <span>${greenZeroStars} com 0 estrelas na última guerra</span>
        <span>·</span>
        <span>${greenZeroTriples} sem ataque com 3 estrelas</span>
        <span>·</span>
        <span>WL (marcados para incluir): ${selection ? selection.whitelistCount : (state.settings.whitelist || []).length}</span>
        <span>·</span>
        <span>BL (excluir): ${selection ? selection.blacklistCount : (state.settings.blacklist || []).length}</span>
      </div>
      ${selection ? `
        <div class="ws-flex ws-small ws-muted" style="margin-top:4px;">
          <span>Composição do time:</span>
          <span>${selectedStrictCount} aptos pelas regras</span>
          <span>·</span>
          <span>${selectedWhitelistCount} incluídos pela WL</span>
          <span>·</span>
          <span>${selectedExceptionCount} exceções</span>
        </div>
      ` : ''}
      ${selection?.targetAdjustedForWhitelist ? `<div class="ws-warning">O tamanho do time foi ampliado para ${selection.target} vagas para incluir os ${selection.whitelistCount} jogadores marcados na WL.</div>` : ''}
      ${selection?.warnings?.length ? selection.warnings.map((w) => `<div class="ws-warning">${esc(state.source === 'worker' && unknown && state.settings.excludeRed && w.startsWith('Só há ') ? `Há ${unknown} escudos desconhecidos. Alguns perfis não puderam ser consultados. Atualize os dados antes de completar o time.` : w)}</div>`).join('') : ''}
      ${state.settings.targetMode === 'current' && !selection?.currentWarSize ? '<div class="ws-warning">Tamanho da guerra atual indisponível. A sugestão usa o padrão mais próximo.</div>' : ''}
    `;
  }

  function statusBadge(row, mode) {
    if (row.blacklisted) {
      return '<span class="ws-badge bad" title="Lista de exclusão: não incluir na sugestão">Exclusão (BL)</span>';
    }
    if (row.whitelistBlocked) {
      return `<span class="ws-badge bad">WL não aplicada: ${esc(row.hardReasons.join(', '))}</span>`;
    }
    if (row.hardFail) {
      return `<span class="ws-badge bad">${esc(row.hardReasons.join(', '))}</span>`;
    }
    if (row.forcedOut) {
      return '<span class="ws-badge bad">Retirado manualmente</span>';
    }
    if (row.forcedIn) {
      return '<span class="ws-badge blue">Inclusão manual</span>';
    }
    if (mode === 'bench' && row.trimmed) {
      return '<span class="ws-badge muted">Sem vaga no time</span>';
    }
    if (row.whitelisted) {
      const reasons = [...row.ruleReasons, ...row.softReasons];
      const extra = reasons.length ? ` (${esc(reasons.join(', '))})` : '';
      const label = mode === 'selected' ? 'Incluído via WL' : 'Marcado na WL';
      return `<span class="ws-badge blue" title="Lista de inclusão: tentar incluir mesmo fora dos critérios de desempenho">${label}${extra}</span>`;
    }
    if (row.ruleReasons.length) {
      return `<span class="ws-badge bad">${esc(row.ruleReasons.join(', '))}</span>`;
    }
    if (row.exception) {
      return `<span class="ws-badge exc">Exceção: ${esc(row.softReasons.join(', ') || 'critério')}</span>`;
    }
    if (row.eligible) {
      return `<span class="ws-badge ${mode === 'selected' ? 'ok' : 'muted'}">${mode === 'selected' ? 'Critérios atendidos' : 'Apto'}</span>`;
    }
    return `<span class="ws-badge muted">${esc(row.softReasons.join(', ') || 'fora')}</span>`;
  }

  function lastWarMetric(row, key) {
    if (!row.inWar) return '<span class="ws-muted" title="Sem registro na última guerra">—</span>';
    return esc(row[key] ?? 0);
  }

  function renderLastWar() {
    const el = $('#ws-lastwar');
    if (!el) return;

    if (!war) {
      el.innerHTML = '';
      return;
    }

    const ourSide = war.result.ourSide || 1;
    const opponentSide = war.result.opponentSide || 2;
    const ourClan = war.result.clans[ourSide] || {};
    const opponentClan = war.result.clans[opponentSide] || {};
    const ourStars = war.result.stars[ourSide] ?? 0;
    const opponentStars = war.result.stars[opponentSide] ?? 0;
    const ourPercent = fmtPct(war.result.percents[ourSide]);
    const opponentPercent = fmtPct(war.result.percents[opponentSide]);
    const attacksUsed = war.ourAttacks.length;
    const attacksMax = war.result.attacksMax || ((war.header.sizeHome || 0) * (war.header.attacksPerMember || 2));
    const cleanups = war.ourAttacks.filter((attack) => attack.cleanup).length;

              <tr>
                <th class="center">#</th>
                <th>Atacante</th>
                <th>Defensor</th>
                <th class="center">Estrelas</th>
                <th class="center">Novas estrelas</th>
                <th class="right">Destruição</th>
                <th class="right">Duração</th>
              </tr>
            </thead>
            <tbody>${attackRows}</tbody>
          </table>
        </div>
        <div class="ws-legend">
          <span>Novas estrelas = estrelas que aumentaram o placar da guerra</span>
          <span>Limpeza = ataque que não acrescentou estrelas porque a base já tinha esse resultado</span>
        </div>
      </details>
    `;
  }

  function copySelected() {
    const selection = state.selection;
    if (!selection?.selected?.length) return;

    const lines = selection.selected.map((row) => `${row.member.name} (#${row.member.tag})`);
    const textToCopy = lines.join('\n');

    const done = () => setStatus(`Lista copiada: ${lines.length} jogadores.`, 'ok');
    if (navigator.clipboard?.writeText) {
      navigator.clipboard.writeText(textToCopy).then(done).catch(() => fallbackCopy(textToCopy, done));
    } else {
      fallbackCopy(textToCopy, done);
    }
  }

  function fallbackCopy(value, done) {
    const ta = document.createElement('textarea');
    ta.value = value;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try {
      if (document.execCommand('copy')) done();
      else setStatus('A cópia automática falhou. Verifique a permissão de área de transferência do navegador e tente novamente.', 'error');
    } catch (error) {
      setStatus('A cópia automática falhou. Verifique a permissão de área de transferência do navegador e tente novamente.', 'error');
    }
    ta.remove();
  }

  function exportJson() {
    const selection = state.selection;
    if (!selection) return;

    const payload = {
      generatedAt: new Date().toISOString(),
      source: state.source, fetchedAt: state.fetchedAt || null, warnings: state.dataWarnings,
      clanTag: state.clanTag,
      settings: state.settings,
      lastWarId: state.lastWar?.id || null,
      currentWar: state.currentWar ? {
        sizeHome: state.currentWar.header.sizeHome,
        sizeAway: state.currentWar.header.sizeAway,
        label: state.currentWar.result.label,
      } : null,
      target: selection.target,
      targetLabel: selection.targetLabel,
      strictCount: selection.strictCount,
      selected: selection.selected.map((row) => ({
        tag: row.member.tag,
        name: row.member.name,
        th: row.member.th,
        position: row.member.position,
        shield: row.member.pref,
        shieldSource: row.member.prefSource || state.source,
        shieldConfirmedAt: row.member.prefConfirmedAt || null,
        attacks: row.attacks,
        stars: row.stars,
        newStars: row.newStars,
        triples: row.triples,
        whitelisted: row.whitelisted,
        blacklisted: row.blacklisted,
        exception: row.exception,
        reasons: [...row.ruleReasons, ...row.softReasons],
      })),
      bench: selection.bench.map((row) => ({
        tag: row.member.tag,
        name: row.member.name,
        th: row.member.th,
        position: row.member.position,
        shield: row.member.pref,
        shieldSource: row.member.prefSource || state.source,
        shieldConfirmedAt: row.member.prefConfirmedAt || null,
        attacks: row.attacks,
        stars: row.stars,
        newStars: row.newStars,
        triples: row.triples,
        whitelisted: row.whitelisted,
        blacklisted: row.blacklisted,
        reasons: [...row.hardReasons, ...row.ruleReasons, ...row.softReasons],
      })),
    };

    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `guerra-${state.clanTag}-${state.lastWar?.id || 'selecao'}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  // ---------------------------------------------------------------------------
  // Boot
  // ---------------------------------------------------------------------------

  function clanTagFromUrl() {
    const m = location.pathname.match(/\/clan\/([0-9A-Z]+)\//i);
    return m ? m[1].toUpperCase() : '';
  }

  function boot() {
    loadSettings();
    const urlTag = clanTagFromUrl();
    if (urlTag) state.clanTag = urlTag;

    injectUI();
    if (!state.members.length && state.settings.autoLoad !== false) {
      // Não carrega sozinho para não disparar requests/captcha sem o usuário pedir.
    }
  }

  // Exposição para debug/teste no console.
  window.__warSelectorDebug = {
    parseMembers,
    parseWar,
    buildWar,
    handleLoad,
    selectTeam,
    render,
    state,
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot, { once: true });
  } else {
    boot();
  }
})();
</script>

<script>
(function () {
  'use strict';

  const demo = JSON.parse(document.getElementById('demo-data').textContent);

  function firstWarId(content) {
    const ids = [];
    const re = /\/war\/(\d+)#war-details/g;
    let m;
    while ((m = re.exec(content || ''))) {
      if (!ids.includes(m[1])) ids.push(m[1]);
    }
    return ids[0] || null;
  }

  function responseBody(entry) {
    const content = entry && entry.response && entry.response.content ? entry.response.content : null;
    if (!content) return '';
    let body = content.text || '';
    if (content.encoding === 'base64') {
      const bin = atob(body);
      const bytes = Uint8Array.from(bin, (ch) => ch.charCodeAt(0));
      body = new TextDecoder('utf-8').decode(bytes);
    }
    return body;
  }

  function unwrap(body) {
    const stripped = String(body || '').trim();
    if (!stripped.startsWith('{')) return body;
    try {
      const payload = JSON.parse(body);
      if (payload && typeof payload.content === 'string') return payload.content;
    } catch (error) {}
    return body;
  }

  function setData(members, lastWar, currentWar, tag, message) {
    const debug = window.__warSelectorDebug;
    const state = debug.state;
    state.source = message.startsWith('Demo') ? 'demo' : 'har';
    state.dataWarnings = []; state.fetchedAt = ''; state.clanName = '';
    state.clanTag = tag;
    state.members = members;
    state.lastWar = lastWar;
    state.currentWar = currentWar;
    state.loading = false;
    state.error = '';
    state.status = message;
    state.statusType = 'ok';
    debug.render();
    document.getElementById('ws-overlay').classList.remove('ws-hidden');
  }

  function loadDemo() {
    if (window.__warSelectorDebug.state.loading) return;
    try {
      const debug = window.__warSelectorDebug;
      const members = structuredClone(demo.members);
      const lastWar = structuredClone(demo.lastWar);
      const currentWar = structuredClone(demo.currentWar);
      setData(members, lastWar, currentWar, '2G8QCR92V',
        'Demo de 20/10/2026: 45 membros, última guerra #285899841.');
    } catch (error) {
      console.error(error);
      const state = window.__warSelectorDebug.state;
      state.error = 'Falha ao carregar a demo: ' + error.message;
      window.__warSelectorDebug.render();
    }
  }

  function inferTag(entries) {
    const input = (document.getElementById('ws-clan')?.value || '').trim().replace(/^#/, '').toUpperCase();
    const viewEntries = entries.filter((entry) =>
      /\/en\/clan\/[0-9A-Z]+\/view(?:[?#]|$)/i.test(entry.request.url || '')
    );
    if (input) {
      const match = viewEntries.find((entry) =>
        (entry.request.url || '').toUpperCase().includes(`/CLAN/${input}/VIEW`)
      );
      if (match) return input;
    }
    for (const entry of viewEntries) {
      const match = (entry.request.url || '').match(/\/clan\/([0-9A-Z]+)\//i);
      if (match) return match[1].toUpperCase();
    }
    return input || null;
  }

  async function loadHar(file) {
    const debug = window.__warSelectorDebug;
    const state = debug.state;
    if (state.loading) return;
    try {
      state.loading = true;
      state.members = []; state.lastWar = null; state.currentWar = null;
      state.source = 'har'; state.dataWarnings = [];
      state.error = '';
      state.status = 'Lendo HAR...';
      state.statusType = 'loading';
      debug.render();

      const har = JSON.parse(await file.text());
      const entries = har?.log?.entries || [];
      if (!entries.length) throw new Error('O arquivo não parece ser um HAR válido.');

      const tag = inferTag(entries);
      if (!tag) throw new Error('Não encontrei a tag do clã. Abra a página /clan/TAG/ no ClashSpot antes de salvar o HAR.');

      const find = (needle) => {
        const matches = entries.filter((entry) => (entry.request.url || '').includes(needle));
        if (!matches.length) return null;
        // Prefere a resposta XHR JSON (fragmento com a tabela) em vez do HTML completo.
        const json = matches.find((entry) => {
          const headers = entry.response && entry.response.headers ? entry.response.headers : [];
          return headers.some((h) =>
            String(h.name).toLowerCase() === 'content-type' &&
            String(h.value).toLowerCase().includes('application/json')
          );
        });
        return json || matches[matches.length - 1];
      };
      const viewEntry = find(`/en/clan/${tag}/view`);
      if (!viewEntry) throw new Error(`O HAR não contém a página de membros /en/clan/${tag}/view.`);

      const members = debug.parseMembers(unwrap(responseBody(viewEntry)));
      if (!members.length) throw new Error('Não encontrei membros na página do clã dentro do HAR.');

      const warsEntry = find(`/en/clan/${tag}/wars`);
      let lastWarId = warsEntry ? firstWarId(unwrap(responseBody(warsEntry))) : null;

      if (!lastWarId) {
        // Fallback: pega o primeiro /war/<built-in function id> que existir no HAR.
        for (const entry of entries) {
          const match = (entry.request.url || '').match(/\/war\/(\d+)/);
          if (match) { lastWarId = match[1]; break; }
        }
      }
      if (!lastWarId) throw new Error('Não encontrei a última guerra concluída no HAR. Abra a aba Wars e a guerra antes de salvar.');

      const warEntry = find(`/en/clan/${tag}/war/${lastWarId}`);
      if (!warEntry) throw new Error(`O HAR não contém a página da guerra #${lastWarId}.`);

      const lastWar = debug.parseWar(unwrap(responseBody(warEntry)), tag, lastWarId);
      const currentEntry = find(`/en/clan/${tag}/war/current`);
      const currentWar = currentEntry ? debug.parseWar(unwrap(responseBody(currentEntry)), tag, 'current') : null;

      setData(members, lastWar, currentWar, tag,
        `HAR carregado: ${members.length} membros, última guerra #${lastWarId}.`);
    } catch (error) {
      state.loading = false;
      state.error = 'Falha ao ler o HAR: ' + error.message;
      state.statusType = 'error';
      debug.render();
    }
  }

  function init() {
    const debug = window.__warSelectorDebug;
    if (!debug) {
      setTimeout(init, 100);
      return;
    }

    const toolbar = document.getElementById('ws-load').parentNode;
    const demoButton = document.createElement('button');
    demoButton.id = 'ws-demo'; demoButton.type = 'button'; demoButton.className = 'ws-btn';
    demoButton.textContent = 'Ver demo'; demoButton.addEventListener('click', loadDemo);
    toolbar.appendChild(demoButton);
    document.getElementById('ws-overlay').classList.remove('ws-hidden');
    document.getElementById('har-file').addEventListener('change', (event) => {
      const file = event.target.files && event.target.files[0];
      if (file) loadHar(file);
      event.target.value = '';
    });
    document.getElementById('demo-btn').addEventListener('click', loadDemo);

    if (new URLSearchParams(location.search).get('demo') === '1') loadDemo();
    else debug.handleLoad();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

  #ws-overlay .ws-panel { width:100%; max-width:1480px; max-height:none; margin:0 auto; border:0; border-radius:0; box-shadow:none; }
  #ws-overlay .ws-body { overflow:visible; }
  #ws-overlay .ws-head { position:static; }
  @media (max-width:720px) { #ws-overlay .ws-panel { max-height:none; } .ws-source p { font-size:14px; } }
