name: coc-clan-manager-cwl
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: coc_cwl
      POSTGRES_USER: coc_cwl
      POSTGRES_PASSWORD: ${CWL_POSTGRES_PASSWORD:?Run npm run db:setup first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - cwl-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coc_cwl -d coc_cwl"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 256m
volumes:
  cwl-postgres:
